name: Staging accessibility audit (non-blocking)
on:
  schedule:
    # Weekday mornings US Eastern (9:15 ET winter / 8:15 summer) — audits the
    # staging mirror and files one digest issue per run; never blocks a deploy.
    - cron: "15 13 * * 1-5"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: staging-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit staging and file the digest issue
        env:
          GH_TOKEN: ${{ github.token }}
          # find_chrome falls back to this; ubuntu runners ship Chrome here
          CHROME_PATH: /usr/bin/google-chrome
          # Row 42 made the audit gate-aware: it attaches the byte-compatible
          # psp_staging cookie to every fetch and Lighthouse run and refuses
          # loudly when the passphrase is absent. Repository secret
          # PSP_STAGING_PASSPHRASE supplies it (same value as the workspace
          # .env the publish tool reads); missing secret = the audit cannot run.
          PSP_STAGING_PASSPHRASE: ${{ secrets.PSP_STAGING_PASSPHRASE }}
        run: python3 tools/staging_audit.py
