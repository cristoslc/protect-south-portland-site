name: Test public site constraints
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Per-ref (2026-11-24): the group was the repo-wide "tests", so any run on
  # the repo — another PR's checks, a push elsewhere — cancelled every
  # in-flight suite mid-run (two cancelled runs on PR #65 tonight, both
  # cancelled at ~40% green, "The operation was canceled"). Same-ref pushes
  # still supersede each other; cross-ref runs no longer kill each other,
  # matching release-gate.yml's per-ref group.
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test site constraints (ledger rows 1/5/6/7/9 + release gate)
        run: |
          pip install pytest
          python -m pytest tests/ -q
      - name: Build (map dir is the committed snapshot; build refreshes the rest)
        run: |
          python tools/build.py docs
          test -f docs/index.html