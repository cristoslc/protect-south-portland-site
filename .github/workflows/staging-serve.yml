name: Staging serve (fork only)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: staging-serve
  cancel-in-progress: false
jobs:
  serve:
    # Inert everywhere except the repository that names itself in the
    # STAGING_SERVE_REPO variable. Upstream (production) never runs a serve;
    # the fork sets the variable in its settings at cutover (runbook phase 1)
    # and staging updates one CI run after every push to fork main. The
    # release-gate workflow runs on the same push, and staging_serve itself
    # refuses a committed docs/ tree that is not a fresh build.
    if: vars.STAGING_SERVE_REPO == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build, scan and push the staging-pages serve branch
        env:
          # Row 128 (2026-11-25): the operator reversed the cutover ruling
          # dec_63blvjzqob1t (corpus dl-20261124T154549-c606) per corpus
          # dl-20261125T142900-d080, so the row-42 cookie gate is injected at
          # this serve step again. The passphrase arrives from the repository
          # secret; only its SHA-256 embeds in the served gate; a missing
          # secret refuses the serve loud — never a keyless gate. Rotation:
          # edit the workspace .env, update this secret, rerun the serve.
          PSP_STAGING_PASSPHRASE: ${{ secrets.PSP_STAGING_PASSPHRASE }}
        run: python3 tools/staging_serve.py --push
